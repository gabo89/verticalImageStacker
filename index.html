<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vertical Image Stack</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

canvas {
    margin-top: 20px;
    border: 1px solid black;
    max-width: 100%;
}
</style>

</head>

<body>

<h2>Vertical Image Stack</h2>

<input type="file" id="images" multiple accept="image/png,image/jpeg">

<br><br>

<button onclick="stackImages()">STACK IMAGES</button>

<button onclick="downloadImage()">DOWNLOAD PNG</button>

<br><br>

<canvas id="canvas"></canvas>


<script>

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => {

            URL.revokeObjectURL(img.src);

            resolve(img);

        };

        img.onerror = reject;

        img.src = URL.createObjectURL(file);

    });

}


async function stackImages() {

    const input = document.getElementById("images");

    const files = Array.from(input.files);

    if (files.length === 0) {

        alert("Please select images");

        return;

    }


    console.log("Images:", files.length);


    // Load all images

    const imgs = await Promise.all(
        files.map(loadImage)
    );


    const width = imgs[0].width;
    const height = imgs[0].height;


    // Validate image sizes

    for (let i = 0; i < imgs.length; i++) {

        if (
            imgs[i].width !== width ||
            imgs[i].height !== height
        ) {

            alert(
                "Image " + files[i].name +
                " has a different size."
            );

            return;

        }

    }


    // Final canvas size

    const finalWidth = width;
    const finalHeight = height * imgs.length;


    console.log(
        "Final size:",
        finalWidth,
        "x",
        finalHeight
    );


    const canvas = document.getElementById("canvas");

    const ctx = canvas.getContext("2d");


    canvas.width = finalWidth;
    canvas.height = finalHeight;


    ctx.imageSmoothingEnabled = false;


    // Clear canvas

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw images vertically

    for (let i = 0; i < imgs.length; i++) {

        ctx.drawImage(
            imgs[i],
            0,
            i * height,
            width,
            height
        );

    }


    console.log("DONE");

}


function downloadImage() {

    const canvas = document.getElementById("canvas");


    if (!canvas.width) {

        alert("Generate the image first");

        return;

    }


    canvas.toBlob(function(blob) {

        const link = document.createElement("a");

        link.download = "stacked_vertical.png";

        link.href = URL.createObjectURL(blob);

        link.click();

        URL.revokeObjectURL(link.href);

    }, "image/png");

}

</script>

</body>
</html>
